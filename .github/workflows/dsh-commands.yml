# Generated by create-dsh-action.
# Local modification: model provider is OpenCode Go, routed through
# .github/dsh-opencode-relay.mjs (see the comment on the relay step).
name: DSH commands

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: dsh-command-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  command:
    if: >-
      github.event.sender.id != 41898282 &&
      contains(github.event.comment.body || github.event.review.body, '@dsh')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      # OpenCode Go requires x-opencode-session on every inference request, and
      # the Action's credential proxy drops that header. This loopback relay
      # adds it and forwards to https://opencode.ai/inference/go/anthropic/v1.
      - name: Start OpenCode Go relay
        run: |
          nohup node .github/dsh-opencode-relay.mjs >/tmp/opencode-relay.log 2>&1 &
          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 0.2
          done
          echo "OpenCode Go relay did not become ready" >&2
          cat /tmp/opencode-relay.log >&2 || true
          exit 1
      - uses: Lixiaoyiao/DSH-action@23a998ccd209f5422f220f038234a89984f0471c
        with:
          # OpenCode Go API key (oc_sk_...). The Action keeps it controller-side.
          deepseek-api-key: ${{ secrets.OPENCODE_API_KEY }}
          # Route model traffic through the local relay, which injects the
          # provider-required x-opencode-session header.
          base-url: http://127.0.0.1:8787/anthropic/v1
          # Keep the search route on the same trusted upstream so the OpenCode
          # key is never sent to another provider.
          web-search-base-url: http://127.0.0.1:8787/anthropic/v1
          # OpenCode Go model ID (not DSH's deepseek-flash). DeepSeek V4.1 Flash
          # requires Settings > Privacy > Regions to include Global; otherwise
          # use another Go model such as glm-5.3-flash.
          model: deepseek-v4.1-flash
          # OpenCode Go does not provide DeepSeek's search/fetch API, so these
          # tools would fail; deny them explicitly instead of failing mid-turn.
          disallowed-tools: '["native.web-search","native.web-fetch"]'
          dsh-version: 0.2.1-rc.2
          permission-profile: standard
          isolation: docker
          # Enable explicitly to accept clear requests such as
          # "@dsh Please fix this bug and open a PR" through the validated write path.
          natural-language-write: "false"
          allow-write: "true"
          run-tests: "true"
          validation-integrity: strict
          # REQUIRED: Replace this fail-closed placeholder with your repository's
          # own credential-free validation argv. No package manager is assumed.
          test-commands: >-
            [["node","-e","console.error('REQUIRED: replace test-commands with your repository validation commands');process.exit(1)"]]
          # Replace this digest-pinned image too if validation needs another toolchain.
          container-image: docker.io/library/node:24.18.0-bookworm@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059
