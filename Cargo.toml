[package]
name = "hot-rs-launcher"
version = "2.8.0"
edition = "2021"
description = "Hot-RS-Launcher — a Rust Minecraft CLI launcher with Microsoft/offline accounts, Fabric/Forge/NeoForge, Modrinth mods and an optional terminal UI"
authors = ["Hotsteel2901"]
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
md-5 = "0.10"
zip = "0.6"
flate2 = "1"
regex = "1"
webbrowser = "0.8"
url = "2"
rayon = "1"
quick-xml = { version = "0.31", features = ["serialize"] }
which = "6"
glob = "0.3"
dirs = "5"
hex = "0.4"
thiserror = "1"
anyhow = "1"
indicatif = "0.17"
keyring = "2"
tempfile = "3"
getrandom = "0.2"
hmac = "0.12"
sha2 = "0.10"
ratatui = "0.29"
crossterm = "0.28"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
# The launcher is I/O bound, but SHA-1 verification, ZIP inflation and JSON
# parsing are hot CPU paths; `z` made those measurably slower for a small
# binary-size win.
opt-level = 3
lto = true
strip = true
